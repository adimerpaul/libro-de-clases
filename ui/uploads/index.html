<title>Libro de Clases 3.0 — DEMO 2.0</title>

<style>
:root{

  --paper:#fffdf7;--paper2:#f8f2e7;--line:#a9bfd4;--line2:#d5e0ea;--desk:#9a643c;--ok:#217a57;--warn:#b36b14;--bad:#b42318;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#13263a;background:#3a261b}
body{min-height:100vh;background:
 radial-gradient(circle at 18% 12%,#c99261 0 5%,transparent 24%),
 repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0 2px,rgba(20,8,3,.025) 2px 6px),
 linear-gradient(120deg,#6b432b,#a76f45 48%,#6b432b)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#root{min-height:100vh}.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:68px;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #dbe3ea;box-shadow:0 3px 18px #0002;z-index:30;position:relative}
.brand{display:flex;align-items:center;gap:12px}.brandmark{width:48px;height:42px;border-radius:11px;background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:center;gap:1px;font-weight:900;box-shadow:0 6px 16px #0f477d44;position:relative}.logo-book{font-size:27px;line-height:1;transform:rotate(180deg)}.logo-waves{font-size:10px;letter-spacing:-3px;position:absolute;right:4px;top:5px;transform:rotate(-18deg)}.brand b{display:block}.brand small{color:#6c7b88}
.topactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:750;background:#eaf0f5;color:#17324d;box-shadow:inset 0 0 0 1px #cfdae4}.btn:hover{filter:brightness(.98)}.btn.primary{background:var(--red);color:#fff;box-shadow:none}.btn.dark{background:#1f2937;color:#fff;box-shadow:none}.btn.small{padding:7px 9px;font-size:12px}.btn.icon{width:38px;height:38px;padding:0}.statuspill{font-size:12px;padding:7px 10px;border-radius:999px;background:#ecfdf5;color:#166534;font-weight:700}

/* LOGIN */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;background:linear-gradient(135deg,#25150f,#51301f 50%,#2d1a13)}
.loginstage{display:grid;place-items:center;padding:48px;position:relative;overflow:hidden}.loginstage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 35% 24%,#ffffff12,transparent 34%),repeating-linear-gradient(90deg,#ffffff03 0 2px,#0000 2px 8px)}

.loginpanel{background:#f8fafc;display:grid;place-items:center;padding:40px}.logincard{width:min(460px,100%);background:#fff;border-radius:24px;padding:34px;box-shadow:0 24px 80px #0004}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;color:var(--red);text-transform:uppercase}.logincard h2{font-size:30px;margin:6px 0}.muted{color:#6b7f91}.field{width:100%;border:1px solid #cfdbe4;border-radius:10px;padding:11px 12px;background:white;outline:none}.field:focus{border-color:#9f151c;box-shadow:0 0 0 3px #b91c1c18}.logincard label{display:block;margin:15px 0 6px;font-size:12px;font-weight:800}.demo-info{margin-top:18px;padding:12px 14px;background:#f3f6f9;border-radius:12px;font-size:12px;line-height:1.55;border:1px solid #dce6ee}

.page-paper{position:relative;background:linear-gradient(90deg,var(--paper),#fff 92%,#f3eee3);border:1px solid #cfd8df;overflow:hidden;transform-style:preserve-3d;backface-visibility:hidden;transition:transform .58s cubic-bezier(.42,.05,.21,.98),box-shadow .58s;z-index:4}
.page-paper.left{border-radius:12px 2px 4px 12px;box-shadow:inset -18px 0 28px #6b4f2c12,8px 8px 14px #0002;padding:30px 34px 38px 42px}.page-paper.right{border-radius:2px 12px 12px 4px;box-shadow:inset 18px 0 28px #6b4f2c10,-6px 8px 14px #0002;padding:30px 42px 38px 34px;transform-origin:left center}
.page-paper.left{transform-origin:right center}.book-spread.turn-next .page-paper.right{transform:rotateY(-168deg);box-shadow:-35px 14px 40px #0007;z-index:10}.book-spread.turn-prev .page-paper.left{transform:rotateY(168deg);box-shadow:35px 14px 40px #0007;z-index:10}
.paper-grain{position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#684d2710 1px,transparent 1px);background-size:4px 4px}.watermark{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:88px;font-weight:900;color:#1f5f9e0d;line-height:.75;text-align:center;pointer-events:none}.page-number{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;font-weight:800;color:#245f98}.page-header{font-family:Georgia,"Times New Roman",serif;text-align:center;color:var(--blue2);font-size:22px;font-weight:700;letter-spacing:.03em;margin-bottom:14px;text-transform:uppercase}.page-subhead{font-size:11px;color:#4f6f8c;text-transform:uppercase;font-weight:800;letter-spacing:.08em;margin:10px 0 6px}.rulebox{border:1px solid var(--line);background:#fff9}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.info-row{display:grid;grid-template-columns:145px 1fr;border-bottom:1px solid var(--line2);min-height:34px;align-items:center}.info-row:last-child{border-bottom:0}.info-label{font-size:10px;font-weight:850;color:#3f6e99;text-transform:uppercase;padding:7px}.info-value{font-family:Georgia,serif;font-size:14px;color:#183a59;padding:6px 8px}.bluebar{background:var(--blue);color:#fff;padding:7px 10px;font-size:11px;font-weight:850;letter-spacing:.03em;text-transform:uppercase}.paper-table{width:100%;border-collapse:collapse;font-size:11px;color:#234b6d;background:#fff9}.paper-table th{background:#e7f0f8;color:#235886;font-size:9px;text-transform:uppercase;letter-spacing:.02em}.paper-table th,.paper-table td{border:1px solid var(--line);padding:5px 6px;vertical-align:middle}.paper-table td.hand{font-family:"Segoe Print","Bradley Hand",cursive;font-size:12px;color:#265c93}.paper-table.tight th,.paper-table.tight td{padding:3px 4px}.paper-table.att th,.paper-table.att td{padding:2px 3px;text-align:center;font-size:9px}.paper-table.att td.name{text-align:left;font-size:10px;white-space:nowrap}.status-letter{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:900}.status-letter.P{background:#e9f8f1;color:#1f7a55}.status-letter.A{background:#feecec;color:#b42318}.status-letter.T{background:#fff3df;color:#a75b06}.status-letter.J{background:#e9effe;color:#3559a6}.status-letter.X{background:#eef1f4;color:#6b7280}
.book-tabs{position:absolute;right:-10px;top:74px;z-index:15;display:flex;flex-direction:column;gap:5px}.tab{width:26px;min-height:100px;border-radius:0 7px 7px 0;border:1px solid #adc1d3;border-left:0;background:#dde8f2;color:#315d86;writing-mode:vertical-rl;text-orientation:mixed;padding:8px 4px;font-size:9px;font-weight:900;letter-spacing:.04em}.tab.active{background:var(--blue);color:#fff}.tab:hover{transform:translateX(3px)}
.book-controls{position:absolute;left:50%;bottom:-53px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;color:#fff;z-index:20}.page-indicator{font-size:12px;background:#0007;padding:8px 12px;border-radius:999px;min-width:170px;text-align:center}.turnbtn{width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#183a59;font-size:21px;font-weight:900;box-shadow:0 6px 18px #0005}.turnbtn:disabled{opacity:.35;cursor:not-allowed}
/* COVER VIEW */
.cover-spread{display:grid;grid-template-columns:1fr 1fr;height:100%}.inside-cover{background:#eae1d2;border-radius:12px 2px 2px 12px;border:1px solid #c6bba8;position:relative;box-shadow:inset -16px 0 30px #0002}.cover-front{background:linear-gradient(145deg,#c81e1e 0 56%,#e5e7eb 56% 70%,#9d151c 70%);border-radius:2px 12px 12px 2px;position:relative;color:#fff;padding:60px 60px;box-shadow:inset 8px 0 16px #0003}.cover-logo{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:900;font-size:18px}.cover-book-icon{font-size:25px;letter-spacing:-4px}.cover-front h1{font-size:64px;line-height:.88;margin:0;letter-spacing:-.04em}.cover-front .version{font-size:25px;font-weight:800;margin-top:12px}.cover-card{margin-top:45px;background:#f8fafce8;color:#17324d;padding:20px;border-radius:6px}.cover-meta{font-size:11px;border-bottom:1px solid #657b8e;padding:8px 4px}.cover-badge{position:absolute;right:45px;bottom:45px;width:126px;height:126px;border-radius:50%;display:grid;place-items:center;text-align:center;background:#1f2937;border:5px solid #f3f4f6;font-weight:850;font-size:12px}.open-book-btn{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:5}
.thumb-strip{position:absolute;left:50%;bottom:-112px;transform:translateX(-50%);display:flex;gap:6px;width:min(1180px,90vw);justify-content:center;z-index:21}.thumb{width:112px;height:54px;border:1px solid #ffffff45;background:#0f172ad9;color:#e7eef7;border-radius:8px;padding:5px 7px;display:grid;grid-template-columns:28px 1fr;grid-template-rows:20px 1fr;text-align:left;box-shadow:0 5px 14px #0005}.thumb.active{outline:2px solid #60a5fa;background:#183b61}.thumb .mini-book{grid-row:1/3;font-size:24px;align-self:center}.thumb b{font-size:10px;line-height:1.1}.thumb small{font-size:8px;color:#b9c7d5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rfid-live{display:flex;align-items:center;gap:8px;border:1px solid #bdd1df;background:#eef8f4;padding:7px 9px;margin-top:8px}.rfid-live small{display:block;color:#608071;font-size:9px;text-transform:uppercase;font-weight:800}.rfid-live b{display:block;font-size:11px;color:#165d43}.scan-dot{width:10px;height:10px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 5px #16a34a18;animation:scanPulse 1.1s infinite}@keyframes scanPulse{50%{box-shadow:0 0 0 12px #16a34a00}}
/* RFID */
.rfid-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;height:calc(100% - 45px)}.portal-card{border:1px solid var(--line);background:#f8fbfe;padding:12px;display:flex;flex-direction:column}.portal-stage{flex:1;min-height:310px;position:relative;background:linear-gradient(#eef5fa,#fbfdff);border:1px solid #bfd0de;overflow:hidden}.floor-line{position:absolute;left:0;right:0;bottom:54px;height:2px;background:#b7c7d5}.gate{position:absolute;bottom:56px;width:86px;height:185px;border:7px solid #486f92;border-bottom:0;border-radius:18px 18px 0 0}.gate:before,.gate:after{content:"";position:absolute;top:35px;width:8px;height:75px;background:#1f5f9e;border-radius:5px;box-shadow:0 0 16px #1f5f9eaa}.gate:before{left:-8px}.gate:after{right:-8px}.gate.one{left:25%}.gate.two{right:18%}.gate-label{position:absolute;top:-28px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:900;color:#315f88}.student-dot{position:absolute;bottom:61px;left:-20px;width:18px;height:18px;border-radius:50%;background:#b91c1c;box-shadow:0 0 0 3px #fff;border:1px solid #801010;opacity:0}.portal-stage.running .student-dot{animation:walkAcross 4.5s linear forwards;animation-delay:var(--delay)}@keyframes walkAcross{0%{left:-20px;opacity:0}5%{opacity:1}42%{left:31%}70%{left:67%}95%{opacity:1}100%{left:102%;opacity:0}}.rfid-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.statbox{border:1px solid #cad8e3;background:#fff;padding:8px;text-align:center}.statbox b{display:block;font-size:22px;color:#164e7b}.exception{border:1px solid #d3dee7;padding:8px;margin-bottom:7px;background:#fff}.exception b{font-size:12px}.exception small{display:block;color:#6b7f91;margin:3px 0}.mini-actions{display:flex;gap:5px;flex-wrap:wrap}.mini-actions button{font-size:9px;padding:5px 6px;border:1px solid #bdcad5;background:#f8fbfd;border-radius:5px}.mini-actions button.resolve{background:#1f5f9e;color:#fff;border-color:#1f5f9e}
/* FORMS */
.paper-input,.paper-textarea,.paper-select{width:100%;border:0;border-bottom:1px solid #8aa8c1;background:transparent;padding:5px;font-family:"Segoe Print","Bradley Hand",cursive;color:#215684;outline:none}.paper-textarea{min-height:80px;resize:vertical;border:1px solid #afc2d1;background:#fff8}.signature{font-family:"Brush Script MT","Segoe Script",cursive;font-size:23px;color:#225b91}.note{font-size:10px;color:#6a8093;line-height:1.45}.notice{padding:8px;border:1px solid #d6e1e9;background:#f7fafc;font-size:10px;color:#506a80}.notice.ok{background:#effaf5;color:#1c694b;border-color:#b9dfcf}.notice.warn{background:#fff8ed;color:#8a5713;border-color:#efd7b0}
/* PRESENTATION */
.presentation{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(1120px,94vw);background:#0f172af2;color:#fff;border-radius:17px;z-index:80;box-shadow:0 20px 60px #0008;padding:14px 16px}.presentation-top{display:flex;align-items:flex-start;gap:14px}.pres-step{font-size:11px;color:#93c5fd;text-transform:uppercase;font-weight:900}.pres-title{font-size:18px;font-weight:850;margin-top:2px}.pres-script{color:#d4dde8;font-size:12px;line-height:1.45;margin-top:4px}.pres-timer{margin-left:auto;font-variant-numeric:tabular-nums;font-size:24px;font-weight:900}.pres-actions{display:flex;gap:7px;margin-top:10px;justify-content:flex-end}.pres-actions button{border:0;border-radius:8px;padding:7px 10px;font-weight:800}.pres-actions .light{background:#fff;color:#13263a}.pres-actions .red{background:#dc2626;color:#fff}
/* MODAL */
.modal{position:fixed;inset:0;background:#09111bd9;display:grid;place-items:center;padding:20px;z-index:100}.modal-card{width:min(600px,95vw);max-height:85vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 25px 75px #0008}.modal-head{display:flex;justify-content:space-between;gap:15px}.close{border:0;width:36px;height:36px;border-radius:50%;background:#edf2f6;font-size:20px}
/* RESPONSIVE */
@media(max-width:1000px){.login{grid-template-columns:1fr}.loginstage{min-height:50vh;padding:25px}.loginpanel{padding:25px}.book-zone{height:690px;width:1180px;transform:scale(.75);transform-origin:center}.workspace{overflow:auto;padding-bottom:130px}.topbar{position:sticky;top:0}.book-controls{bottom:-52px}.thumb-strip{bottom:-112px}}
@media(max-width:720px){.topbar{height:auto;min-height:68px;padding:10px 12px;align-items:flex-start}.brand small{display:none}.topactions .statuspill{display:none}.book-zone{width:1100px;height:680px;transform:scale(.56)}.workspace{display:block;overflow:auto;padding:12px;min-height:800px}.book-controls{bottom:-54px}.presentation{bottom:7px}.pres-script{max-height:52px;overflow:auto}.loginbook{width:330px;padding:35px 28px}.loginbook h1{font-size:45px}.format-badge{width:95px;height:95px;right:20px;bottom:30px}.loginstage{padding:20px}.logincard{padding:24px}.cover-front h1{font-size:50px}}
</style>
